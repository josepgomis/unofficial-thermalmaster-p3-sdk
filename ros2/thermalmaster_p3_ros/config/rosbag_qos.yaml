# Match the node's sensor-data QoS even before DDS discovers its publishers.
/thermal/raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/thermal/temperature:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/thermal/ir:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
/thermal/camera_info:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 5
