name: SDK and ROS 2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel outside source tree
        shell: bash
        run: |
          python -m venv wheel-check
          if [ "$RUNNER_OS" = Windows ]; then PY=wheel-check/Scripts/python.exe; else PY=wheel-check/bin/python; fi
          "$PY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" "$GITHUB_WORKSPACE/tools/wheel_smoke.py"
  ros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [foxy, humble, jazzy]
    container: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y libusb-1.0-0 python3-pip python3-pytest python3-colcon-common-extensions python3-numpy python3-usb python3-yaml python3-setuptools python3-wheel ros-${ROS_DISTRO}-diagnostic-msgs ros-${ROS_DISTRO}-std-srvs ros-${ROS_DISTRO}-sensor-msgs ros-${ROS_DISTRO}-rosbag2
          python3 -m pip install --target /opt/p3-sdk .
      - name: Build and test ROS package
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          export PYTHONPATH=/opt/p3-sdk:$PYTHONPATH
          colcon build --base-paths ros2 --event-handlers console_direct+
          source install/setup.bash
          export PYTHONPATH=/opt/p3-sdk:$PYTHONPATH
          python3 -c "import thermalmaster_p3; print(thermalmaster_p3.__file__)"
          colcon test --packages-select thermalmaster_p3_ros --event-handlers console_direct+
          colcon test-result --verbose
      - name: rosbag2 simulated capture smoke test
        shell: bash
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          export PYTHONPATH=/opt/p3-sdk:$PYTHONPATH
          source install/setup.bash
          export PYTHONPATH=/opt/p3-sdk:$PYTHONPATH
          python3 ros2/thermalmaster_p3_ros/test/rosbag_smoke.py
